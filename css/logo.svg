<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Square background with rounded corners -->
  <rect x="0" y="0" width="200" height="200" rx="24" ry="24" fill="url(#bgGrad)" />

  <!-- Bar chart icon centered in the upper half -->
  <!-- Bar 1 (short) -->
  <rect x="58" y="100" width="16" height="36" rx="3" fill="#ffffff" opacity="0.65" />
  <!-- Bar 2 (medium) -->
  <rect x="82" y="80" width="16" height="56" rx="3" fill="#ffffff" opacity="0.80" />
  <!-- Bar 3 (tall) -->
  <rect x="106" y="58" width="16" height="78" rx="3" fill="#ffffff" />

  <!-- Upward trend arrow across bars -->
  <polyline points="66,96 90,74 114,52" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
  <polygon points="114,52 105,57 110,64" fill="#ffffff" opacity="0.55" />

  <!-- Divider line -->
  <line x1="30" y1="148" x2="170" y2="148" stroke="#ffffff" stroke-width="1" opacity="0.25" />

  <!-- ATEM wordmark -->
  <text
    x="100"
    y="170"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="36"
    font-weight="700"
    letter-spacing="4"
    fill="#ffffff"
  >ATEM</text>

  <!-- Tagline -->
  <text
    x="100"
    y="188"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="8"
    font-weight="400"
    letter-spacing="2"
    fill="#c0d8ff"
    opacity="0.85"
  >PERFORMANCE SYSTEM</text>
</svg>
