<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Square background with rounded corners -->
  <rect x="0" y="0" width="200" height="200" rx="24" ry="24" fill="url(#bgGrad)" />

  <!-- Left half: ATEM mini bar chart with upward trend -->
  <rect x="38" y="110" width="12" height="26" rx="2" fill="#ffffff" opacity="0.65" />
  <rect x="54" y="94" width="12" height="42" rx="2" fill="#ffffff" opacity="0.80" />
  <rect x="70" y="76" width="12" height="60" rx="2" fill="#ffffff" />
  <polyline points="44,106 62,88 80,68" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
  <polygon points="80,68 71,71 76,79" fill="#ffffff" opacity="0.55" />

  <!-- Center divider between the two icons -->
  <line x1="100" y1="60" x2="100" y2="140" stroke="#ffffff" stroke-width="1" opacity="0.2" />

  <!-- Right half: OKR mini target with arrow -->
  <circle cx="145" cy="97" r="26" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.55" />
  <circle cx="145" cy="97" r="16" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.75" />
  <circle cx="145" cy="97" r="7" fill="#ffffff" />
  <line x1="176" y1="62" x2="151" y2="87" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="176,62 165,64 173,73" fill="#ffffff" />

  <!-- Divider line -->
  <line x1="30" y1="148" x2="170" y2="148" stroke="#ffffff" stroke-width="1" opacity="0.25" />

  <!-- Combined wordmark -->
  <text
    x="100"
    y="172"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="2"
    fill="#ffffff"
  >ATEM+OKR</text>

  <!-- Tagline -->
  <text
    x="100"
    y="188"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="7"
    font-weight="400"
    letter-spacing="1.5"
    fill="#c0d8ff"
    opacity="0.85"
  >PERFORMANCE &amp; GOALS</text>
</svg>
